# ASKOHEAT+ Dashboard — Phase 3
#
# WICHTIG für andere Nutzer: die Entity-IDs unten (z.B.
# "sensor.ahf280_ti_plus_15_8_temperatur") sind Andreas' echte IDs für sein
# konkretes Gerätemodell (AHF280-TI-plus-15.8). Sie hängen vom jeweiligen
# Artikelnamen deines eigenen Geräts ab (Settings -> Geräte & Dienste ->
# ASKOHEAT+ -> Entitäten, oder einfach "askoheat" in der Entity-Suche).
# Bitte vor der Nutzung auf die eigenen Entity-IDs anpassen.
#
# Positionen (top/left in %) sind ein Startpunkt, keine Präzisionsmessung —
# im Lovelace-UI-Editor (Karte bearbeiten -> Elemente) bequem per Drag&Drop
# nachjustierbar. Details: custom_components/askoheat_plus/docs/11_dashboard.md
#
# Hinweis: bewusst OHNE YAML-Anker/Merge-Keys (&/*'/<<) geschrieben — Home
# Assistants eigener YAML-Loader (annotatedyaml) behandelt "<<: *anchor" +
# zusätzliche Keys in derselben Mapping als Duplicate-Key-Warnung statt sie
# sauber zu mergen. Jedes style-Element ist daher vollständig ausgeschrieben.

title: ASKOHEAT+
views:
  - title: Übersicht
    path: askoheat-plus
    icon: mdi:radiator
    cards:
      - type: markdown
        content: >
          ## Heizstab — Temperaturen & Leistung

          Sensor 0 sitzt direkt am Heizstab, Sensor 1–4 sind zusätzliche
          Messpunkte am Tank (falls am Gerät nicht angeschlossen: "nicht
          verfügbar" — siehe `docs/11_dashboard.md` im Repo für Details).

      - type: picture-elements
        image: /local/askoheat_plus/boiler-sensors.png
