name: Validate

# Prüft bei jedem Push/PR sowie täglich, dass das Repo die Anforderungen von
# HACS (Aufnahme in den Standard-Store) und Home Assistant (hassfest) erfüllt.
# Läuft nur auf GitHub (HACS unterstützt nur GitHub), nicht auf GitLab.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
